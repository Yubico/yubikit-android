name: Release

on:
  push:
    tags:
      # Release candidates only. The published version comes from the `version`
      # property in build.gradle.kts, not from the tag -- the tag just marks which
      # attempt to build. Re-tag as -rc.2, -rc.3, ... until a candidate is good,
      # then release that deployment from the Central Portal.
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # The published version comes from build.gradle.kts, not from the tag, so a stale
      # version would silently republish the previous release under a new tag. Fail here,
      # before anything is built or signed.
      - name: Verify tag matches project version
        run: |
          # pipefail so a Gradle failure surfaces as itself, not as a bogus version mismatch.
          set -o pipefail
          tag_version="${GITHUB_REF_NAME%-rc.*}"
          project_version="$(./gradlew -q printVersion | tail -n 1)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} builds version '${tag_version}', but build.gradle.kts declares '${project_version}'. Set the version in build.gradle.kts to '${tag_version}' (without -SNAPSHOT), or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches project version ${project_version}"

      - name: Verify code format
        run: ./gradlew spotlessCheck

      - name: Build and publish to local Maven repo
        run: ./gradlew --stacktrace check test build javadocJar publishToMavenLocal

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-repo
          path: ~/.m2/repository/com/yubico/yubikit/
          if-no-files-found: error

  sign:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download unsigned artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo
          path: maven-repo

      - name: Generate scribe config
        run: |
          SCRIBE_SIGN_GPG=.github/scribe-sign-gpg.yml
          {
            echo 'stub: yubikit-android'
            echo 'releaseType: public'
            echo 'jobs:'
            echo '  - name: sign-source'
            echo '    platform: linux'
            echo '    steps:'
            echo '      - id: 1'
            echo '        action: gpg'
            echo '        files:'
            find maven-repo -type f \( -name '*.jar' -o -name '*.aar' -o -name '*.pom' -o -name '*.module' \) | sort | while read -r f; do
              # Quote the path as a YAML scalar so special characters cannot break the config.
              echo "          - \"$f\""
            done
          } > "$SCRIBE_SIGN_GPG"
          echo "=== Generated scribe config ==="
          cat "$SCRIBE_SIGN_GPG"

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ci@yubico.com
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write service account credentials
        env:
          GAC: ${{ secrets.SCRIBE_SA }}
        run: |
          echo "${GAC}" > scribe_sa.json
          # Credentials must not be world-readable to other processes on the runner.
          chmod 600 scribe_sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/scribe/scribe_sa.json" >> $GITHUB_ENV

      - name: Sign artifacts with Scribe (GPG)
        # Forward the full runner environment: scribe-ci auto-detects that it runs in CI
        # and derives the submission reference from the GITHUB_*/CI variables. On a
        # GitHub-hosted runner this environment carries no secrets (GITHUB_TOKEN and
        # secrets.* are never exported as env vars here), so nothing sensitive is passed.
        run: >
          docker run
          --user $(id -u):$(id -g)
          --volume $(pwd):/scribe
          --env-file <(env)
          ghcr.io/yubico/scribe-ci:v1
          --project-id scribe-prod-987134
          --bucket scribe-u-pub-yubikit-android-4qvtbt
          --config /scribe/.github/scribe-sign-gpg.yml
          submit .
          --synchronous
          --download-artifacts

      - name: Place signatures alongside artifacts
        run: |
          mkdir -p signed
          mv scribe-download/*/sign-source/1.zip signed/
          rm -rf scribe-download
          cd signed
          unzip 1.zip || true
          rm 1.zip
          cd ..
          # Convert each .sig to an armored .asc placed next to its artifact. The signature
          # path mirrors the tree submitted to Scribe (…/maven-repo/…), so the target is
          # recovered from the full relative path — not the bare filename, which would be
          # ambiguous if two modules ever shared an artifact name.
          while IFS= read -r sig; do
            rel="${sig#*maven-repo/}"   # com/yubico/yubikit/.../foo.jar.sig
            rel="${rel%.sig}"           # com/yubico/yubikit/.../foo.jar
            target="maven-repo/$rel"
            if [ ! -f "$target" ]; then
              echo "ERROR: no artifact found for signature $sig (expected $target)" >&2
              exit 1
            fi
            gpg --enarmor < "$sig" | sed 's/ARMORED FILE/SIGNATURE/' > "${target}.asc"
          done < <(find signed -type f -name '*.sig')
          echo "=== Signature files placed ==="
          find maven-repo -name '*.asc' | sort
          echo "=== Count ==="
          find maven-repo -name '*.asc' | wc -l

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-repo-signed
          path: maven-repo/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [sign]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # The signed artifact contains the tree below com/yubico/yubikit/, so it is
      # extracted back under that prefix to reconstruct the Maven repository layout.
      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-repo-signed
          path: maven-repo/com/yubico/yubikit

      - name: Publish to Sonatype Central Portal
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: >
          ./gradlew publishToCentralPortal
          -PcentralPortal.repoDir="${{ github.workspace }}/maven-repo"
          -PcentralPortal.deploymentName="yubikit-android ${{ github.ref_name }}"
          -Psonatype.username="$SONATYPE_USERNAME"
          -Psonatype.password="$SONATYPE_PASSWORD"

